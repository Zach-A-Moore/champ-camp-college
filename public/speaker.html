<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak — Champ Camp College</title><link rel="stylesheet" href="static/page.css"></head>
<body>
<div class="bar"><a href="index.html">CHAMP CAMP &gt;&gt; COLLEGE</a><span id="who"></span></div>
<div class="box">
  <h1>Be a Speaker or Guest</h1>
  <p class="muted">You'll need to verify your email first so we can reach you.</p>
  <form id="f" class="hidden">
    <div><label for="kind">I'd like to</label>
      <select id="kind"><option value="speaker">Be a guest speaker</option><option value="guest">Attend as a guest</option></select></div>
    <div><label for="name">Name</label><input id="name" maxlength="100" required></div>
    <div><label for="topic">Topic / message</label><textarea id="topic" rows="5" maxlength="2000"></textarea></div>
    <div id="cap"></div>
    <button class="btn" type="submit">Submit</button>
  </form>
  <p id="needLogin" class="hidden"><a class="btn" href="login.html?next=speaker.html" style="display:inline-block;text-decoration:none">Log in with email</a></p>
  <div class="msg" id="msg"></div>
</div>
<script src="static/common.js"></script>
<script src="static/speaker.js"></script>
</body></html>
